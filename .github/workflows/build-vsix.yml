name: Build VSIX

# Packages the extension and, for a v* tag, attaches the VSIX to that release
# so it can be installed on a machine without the build toolchain:
#
#   gh release download v1.14.2 --repo teoboetti/vscode-react-native
#   codium --install-extension vscode-react-native-1.14.2.vsix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npx vsce package

      - name: Attach the VSIX to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
