name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Bundle extension
        run: npx gulp prod-build

      - name: Build
        run: npm run build

      - name: Test
        run: xvfb-run -a npm test

      - name: Localization tests
        run: xvfb-run -a npm run test-localization
